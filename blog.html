<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Omar Ashraf Habib</title>
  <meta name="description" content="Blog posts by Omar Ashraf Habib documenting the development of this site.">

  <!-- External stylesheet (Level 3: external CSS) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Internal stylesheet (Level 2: internal CSS) — page-specific layout -->
  <style>
    .blog-header {
      padding: 4rem 0 1rem;
      max-width: 60ch;
    }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 2rem 0 3rem;
    }

    .filter-bar input {
      flex: 1;
      min-width: 220px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--bg-raised);
      color: var(--text);
    }
    .filter-bar input:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 1px;
    }

    /* Post cards — styled here so js/blog.js only needs to worry about markup,
       not appearance, once it starts rendering posts in Phase 2 Part 3 */
    #blog-list {
      display: grid;
      gap: 1.5rem;
      padding-bottom: 4rem;
    }

    .post-card {
      position: relative;
      padding-left: 1.75rem;
      border-left: 2px solid var(--border);
    }

    .post-card .post-meta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .post-card .post-meta .category-tag {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .post-card h3 { margin-bottom: 0.4rem; }

    .post-card .latest-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: var(--accent-2);
      color: #1D1D1B;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
    }

    .post-card .read-more {
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    /* Placeholder shown until js/blog.js replaces it in Phase 2 */
    .blog-placeholder {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    #no-results {
      display: none;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--font-mono);
      padding: 3rem 0;
    }
  </style>
</head>
<body data-theme="light">
    <script>
    (function () {
        var saved = localStorage.getItem("theme");
        if (saved) document.body.setAttribute("data-theme", saved);
    })();
    </script>
  <!-- ===== Header / Navigation ===== -->
  <div id="header-placeholder"></div>

  <main class="container">

    <section class="blog-header">
      <p class="eyebrow">// blog</p>
      <h1>Dev Log</h1>
      <p style="color: var(--text-muted);">
        Notes on building this site — what I built, how I approached it, and
        what I learned along the way. Posts load dynamically from
        <code>data/posts.json</code>.
      </p>
    </section>

    <!-- Filter bar: wired up in Phase 2, Part 5 -->
    <div class="filter-bar">
      <input type="text" id="filter-input" placeholder="Search posts by title or category…">
    </div>

    <!-- Posts render here via js/blog.js in Phase 2, Part 3.
         Until then, this placeholder shows the layout is ready. -->
    <div id="blog-list">
      <p class="blog-placeholder">
        Posts will appear here once data/posts.json and js/blog.js are added
        (Phase 2, Part 3).
      </p>
    </div>

    <p id="no-results">No posts match your search.</p>

  </main>

  <!-- ===== Footer ===== -->
  <div id="footer-placeholder"></div>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
